<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="static/log-reg.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body2">
                <h4> Welcome to Quiz Master</h4>
                <h2 style="text-align:center;"> Registration</h2>
                <form action="/register" method="post">
                    <div class="mb-3">
                        <label for="Username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="user123" name="u_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="pwd" class="form-label">Password</label>
                        <input type="password" class="form-control" id="pwd" placeholder="pwd" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full name</label>
                        <input type="text" class="form-control" id="full_name" placeholder="name" name="full_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="qualification" class="form-label">Qualification</label>
                        <select class="form-control" id="qualification" name="qualification" required>
                            <option value="" disabled selected>Select your qualification</option>
                            <option value="High-School">Statistics</option>
                            <option value="Intermediate ">Mathematics  </option>
                            <option value ="Foundation">Physics</option>
                            <option value="Diploma">Python</option>
                            <option value ="Graduate">Java</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="dob" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="dob" name="dob" required>
                    </div>
                    <input type="submit" class="btn btn-primary" value="Register">
                </form>
                
                <div style="text-align:center;">
                    Existing User? <a href="/login">Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
