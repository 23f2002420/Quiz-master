<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="{{url_for('static', filename ='user_dash.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
            <a class="navbar-brand" href="#">Quiz Master</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home </a></li>
                    <li class="nav-item"><a class="nav-link" href="{{url_for('view_scores',user_id =user.id)}}">Scores </a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Summary</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Logout </a></li>
                </ul>
                <form class="d-flex" action="{{ url_for('user_dashboard', user_id=user.id) }}" method=["GET"]>
                    <input class="form-control me-2" type="search" placeholder="Search Quizzes" name="search_query" value="{{ search_query }}">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <span class="navbar-text">Welcome {{user.username}}</span>
            </div>
        </nav>

        <h3>Upcoming Quizzes</h3>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>No. of Questions</th>
                    <th>Date</th>
                    <th>Duration</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for quiz in upcoming_quizzes %}
                <tr>
                    <td>{{ quiz.id }}</td>
                    <td>{{ quiz.questions|length }}</td>
                    <td>{{ quiz.date_of_quiz.strftime('%d/%m/%Y')}}</td>
                    <td>{{ quiz.duration }}</td>
                    <td>
                        <a href="{{ url_for('view_quiz', quiz_id = quiz.id) }}"><button class="btn btn-info btn-sm">View</button></a>
                        <a href="{{ url_for('start_quiz', quiz_id = quiz.id) }}"><button class="btn btn-success btn-sm">Start</button></a>                        
                    </td>
                </tr>
                {% endfor %}    
            </tbody>
        </table>
    </div>
</body>
</html>
</body>
</html>
