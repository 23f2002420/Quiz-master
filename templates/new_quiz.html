<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='new_quiz.css') }}">
</head>
<body>
    <div id="main">
        <div id="canvas">
            <form method="POST" action="{{ url_for('new_quiz') }}">
                <div class="form-group">
                    <label for="title">Quiz Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="chapter_id">Chapter:</label>
                    <select id="chapter_id" name="chapter_id" required>
                        <option value="">Select a Chapter</option>
                        {% for chapter in chapters %}
                            <option value="{{ chapter.id }}">{{ chapter.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="date_of_quiz" class="form-label">Date:</label>
                    <input type="date" class="form-control" id="date_of_quiz" name="date_of_quiz" required>
                </div>
                <div class="form-group">
                    <label for="duration">Duration:</label>
                    <input type="time" id="duration" name="duration" required step="60">
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="is_active" name="is_active">
                    <label class="form-check-label" for="is_active">Is Active</label>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{url_for('quiz_management')}}"><button type="button" class="btn-btn-primary">Cancel</button></a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
