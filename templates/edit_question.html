<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='new_ques.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h2>Edit Question</h2>
        <form method="POST" action="{{ url_for('edit_question', question_id =question.id) }}">

            <div class="form-group">
                <label for="question_title">Question Title:</label>
                <input type="text" name="question_title" id="question_title" value="{{ question.question_title }}" required>
            </div>

            <div class="options-container">
                <h3>Single Option Correct</h3>
                <div class="option">
                    <label for="option1">Option 1:</label>
                    <input type="text" name="option1" id="option1" value="{{ question.option1 }}" required>
                </div>
                <div class="option">
                    <label for="option2">Option 2:</label>
                    <input type="text" name="option2" id="option2" value="{{ question.option2 }}" required>
                </div>
                <div class="option">
                    <label for="option3">Option 3:</label>
                    <input type="text" name="option3" id="option3" value="{{ question.option3 }}" required>
                </div>
                <div class="option">
                    <label for="option4">Option 4:</label>
                    <input type="text" name="option4" id="option4" value="{{ question.option4 }}" required>
                </div>
                <div class="form-group correct-option">
                    <label for="correct_option">Correct Option:</label>
                    <select name="correct_option" id="correct_option">
                        <option value="1" {% if question.correct_option == 1 %}selected{% endif %}>Option 1</option>
                        <option value="2" {% if question.correct_option == 2 %}selected{% endif %}>Option 2</option>
                        <option value="3" {% if question.correct_option == 3 %}selected{% endif %}>Option 3</option>
                        <option value="4" {% if question.correct_option == 4 %}selected{% endif %}>Option 4</option>
                    </select>
                </div>
            </div>
            <div class="buttons">
                <button type="submit" class="btn btn-primary">Save and Next</button>
                <a href="{{ url_for('quiz_management') }}" class="btn btn-secondary close-btn">Close</a>
            </div>
        </form>
    </div>
</body>
</html>
