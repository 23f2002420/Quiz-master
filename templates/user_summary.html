<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Summary</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'user_dash.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
</head>
<body>
    <div id="main">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
            <a class="navbar-brand" href="#">Quiz Master</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{{url_for('user_dashboard', user_id =user.id)}}">Home </a></li>
                    <li class="nav-item"><a class="nav-link" href="{{url_for('view_scores',user_id =user.id)}}">Scores </a></li>
                    <li class="nav-item"><a class="nav-link" href="{{url_for('user_summary', user_id =user.id)}}">Summary</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Logout </a></li>
                </ul>
                <form class="d-flex" action="{{ url_for('user_dashboard', user_id=user.id) }}" method=["GET"]>
                    <input class="form-control me-2" type="search" placeholder="Search Quizzes" name="search_query" value="{{ search_query }}">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <span class="navbar-text">Welcome {{user.username}}</span>
            </div>
        </nav>
        <div class ="summary-charts">
            <div class ="chart_container">
                <img src = "data: image/png; base64, {{chart_image}}" alt = "Summary Charts" >
            </div>
        </div>
    </body>
</html>
