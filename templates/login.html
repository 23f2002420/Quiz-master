<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="static/log-reg.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />    
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h3> Welcome to Quiz Master</h3>
                <h4 style="text-align:center;"> Login Form </h4>
                <form action="/login", method="post">
                    <div class="mb-3">
                        <label for="Username" class="form-label"><i class="fas fa-user"></i>Username</label>
                        <input type="text" class="form-control" id="username" placeholder="user123" name="u_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="pwd" class="form-label"><i class="fas fa-user"></i>Password</label>
                        <input type="password" class="form-control" id="pwd" name="pwd" required>
                    </div>
                    <div class="button-group">
                    <button type="submit" class="btn btn-primary"<i class="fas fa-sign-in-alt"></i>Login</button>
                    </div>
                </form>
                <div style="text-align:center;">
                    <p>Create new user? <a href="/register">register</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
