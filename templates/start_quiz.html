<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>start quiz</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'start_quiz.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script>    
        function updateTimer() {
            let timeLeft = document.getElementById('time-left').innerText;
            let timeParts = timeLeft.split(':');
            let hours = parseInt(timeParts[0]);
            let minutes = parseInt(timeParts[1]);
            let seconds = parseInt(timeParts[2]);
            seconds--;

            if (seconds < 0) {
                seconds = 59;
                minutes--;
            }
            if (minutes < 0) {
                minutes = 59;
                hours--;
            }
            document.getElementById('time-left').innerText =
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
            if (hours === 0 && minutes === 0 && seconds === 0) {
                alert("Time is up!");
                document.getElementById("submit-btn").disabled = true;
            }
        }
        setInterval(updateTimer, 1000);
    </script>
</head>
<body>
    <div class="container mt-5">
        <h3>Start Your Quiz</h3>
        <form method ="POST">
            <div class="d-flex justify-content-between">
                <span>Q. No: <strong>{{current_question_index }}/{{total_questions}}</strong></span>
                <span>Time Left: <strong id ="time-left">{{time_left}}</strong></span>
            </div>
            <div class="card mt-4">
                <div class="card-body">
                    <p><strong>Question Title:</strong>{{question.question_title}} </p>
                    <div class="container">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="answer" id="option1" value="1" {% if  selected_answer == "1" %}checked{%endif %}>
                                    <label class="form-check-label" for="option1">{{question.option1}}</label>
                                </div>    
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="answer" id="option2" value="2" {% if selected_answer == "2"%}checked{%endif %}>
                                    <label class="form-check-label" for="option2">{{question.option2}}</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="answer" id="option3" value="3" {% if selected_answer == "3" %}checked{%endif %}>
                                    <label class="form-check-label" for="option3">{{question.option3}}</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="answer" id="option4" value="4" {% if selected_answer == "4" %}checked{%endif %}>
                                    <label class="form-check-label" for="option4">{{question.option4}}</label>
                                </div>
                            </div> 
                        </div>       
                    </div>
                    <div class="mt-4">
                        <button class="btn btn-primary"type ="submit" name ="action" value="Previous">Previous</button>
                        <button class="btn btn-primary"type ="submit" name ="action" value="next">Save and Next</button>
                        <button class="btn btn-success" type="submit" name = "action" value = "submit">Submit</button>
                    </div>
                </div>
            </div>
    </form>
    </div>
</body>
</html>
