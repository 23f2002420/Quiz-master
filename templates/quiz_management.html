<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Management</title>
    <link rel="stylesheet" href="{{url_for('static', filename='admin_quizm.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
</head>
<body>
    <div id="main">
        <div class="navbar">
            <div>
                <a href="{{url_for('admin_dashboard')}}">Home</a>
                <a href="#">Quiz</a>
                <a href="{{url_for('admin_summary')}}">Summary</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
            <div class="search">
                <form action="{{ url_for('quiz_management') }}" method="GET">
                    <input type="text" name="search_query" placeholder="search" value="{{ search_query }}">
                    <button type="submit">Search</button>
                </form>
            </div>
            <div>Welcome Admin</div>
        </div>

        <div class="dashboard">
            <div class="subject-container">
                {% for quiz in quizzes %}
                <div class="subject-card">
                    <h3>{{quiz.title}} </h3>
                    <table class="chapter-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Question title </th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for question in quiz.questions %}
                            <tr>
                                <th>{{question.id}}</th>
                                <th>{{ question.question_title}}</th>
                                <th>
                                    <a href="{{url_for('edit_question', question_id = question.id)}}" class="btn-btn-primary"><button type="submit" class="btn btn-primary">Edit</button></a>
                                    <a href="{{url_for('delete_question', question_id = question.id)}}" class="btn-btn-primary"><button type="submit" class="btn btn-danger">Delete</button></a>
                                </th>
                            </tr>
                            {% endfor %}
                        </tbody>    
                    </table>
                    <div class = "add-question-container">
                        <a href="{{url_for('new_question', quiz_id= quiz.id)}}"><button class="add-chapter">Add Questions</button></a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <div class= "all-quizzes">
        <a href="{{url_for('new_quiz')}}"><button class="btn-add-quiz"> Add Quiz </button></a>
    </div>
</body>
</html>
