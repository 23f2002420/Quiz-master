<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Question</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='new_ques.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h2>New Question</h2>
        <form method="POST" action="{{ url_for('new_question', quiz_id=quiz.id) }}">
            <div class="form-group">
                <label for="question_title">Question Title:</label>
                <input type="text" id="question_title" name="question_title" class="form-control" required>
            </div>
            <div class="options-container">
                <h3>Single Option Correct</h3>
                <div class="option">
                    <label for="option1">Option 1:</label>
                    <input type="text" id="option1" name="option1" class="form-control" required>
                </div>
                <div class="option">
                    <label for="option2">Option 2:</label>
                    <input type="text" id="option2" name="option2" class="form-control" required>
                </div>
                <div class="option">
                    <label for="option3">Option 3:</label>
                    <input type="text" id="option3" name="option3" class="form-control" required>
                </div>
                <div class="option">
                    <label for="option4">Option 4:</label>
                    <input type="text" id="option4" name="option4" class="form-control" required>
                </div>
                <div class="form-group correct-option">
                    <label for="correct_option">Correct Option:</label>
                    <select id="correct_option" name="correct_option" class="form-control" required>
                        <option value="1">Option 1</option>
                        <option value="2">Option 2</option>
                        <option value="3">Option 3</option>
                        <option value="4">Option 4</option>
                    </select>
                </div>
            </div>
            <div class="buttons">
                <button type="submit" class="btn btn-primary">Save and Next</button>
                <a href="{{ url_for('quiz_management') }}" class="btn btn-secondary close-btn">Close</a>
            </div>
        </form>
    </div>
</body>
</html>
