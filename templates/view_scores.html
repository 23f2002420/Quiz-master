<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scores</title>
    <link rel="stylesheet" href="{{url_for('static', filename ='user_dash.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="main">
        <nav class="navbar">
            <div>               
                <a href="{{url_for('user_dashboard', user_id=user_id)}}">Home </a>
                <a href="{{url_for('view_scores',user_id =user.id)}}">Scores</a>
                <a href="{{url_for('user_summary', user_id =user.id)}}">Summary</a>
                <a href="/login">Logout</a>
            </div>    
                <form class="d-flex" action="{{ url_for('user_dashboard', user_id=user.id) }}" method=["GET"]>
                    <input class="form-control me-2" type="search" placeholder="Search Quizzes" name="search_query" value="{{ search_query }}">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <span class="navbar-text">Welcome {{user.username}}</span>
        </nav>
        <h3>Quiz Scores</h3>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>No. of Questions</th>
                    <th>Date</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                {% for score in scores %}
                <tr>
                    <td>{{score.quiz_id}}</td>
                    <td>{{score.quiz.questions|length}}</td>
                    <td>{{score.quiz.date_of_quiz.strftime('%d-%m-%Y')}}</td>
                    <td>{{score.total_scored}}/{{score.quiz.questions|length}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
